<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;500;600&display=swap" />
  <title>Assigner - Presentation</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%23181614'/%3E%3Crect x='8' y='14' width='16' height='22' rx='3.5' transform='rotate(-12 16 25)' fill='%2338bdf8' opacity='0.85'/%3E%3Crect x='24' y='14' width='16' height='22' rx='3.5' transform='rotate(12 32 25)' fill='%23a855f7' opacity='0.85'/%3E%3Crect x='15' y='11' width='18' height='24' rx='4' fill='%23f59e0b' stroke='%23181614' stroke-width='1.5'/%3E%3Crect x='19' y='16' width='10' height='2' rx='1' fill='%23ffffff' opacity='0.9'/%3E%3Crect x='19' y='21' width='7' height='2' rx='1' fill='%23ffffff' opacity='0.7'/%3E%3Ccircle cx='20' cy='27' r='1.5' fill='%23ffffff'/%3E%3Ccircle cx='25' cy='27' r='1.5' fill='%23ffffff'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #0b0a08;
      --surface: #141210;
      --fg: #f3eee6;
      --muted: #9a9284;
      --card-w: clamp(10.25rem, 42vw, 17.25rem);
      --card-h: calc(var(--card-w) * 1.5);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100vh;
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: Outfit, ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      cursor: pointer;
    }

    button:not(:disabled):active {
      scale: 0.96;
    }

    body {
      padding: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .main-content {
      flex: 1;
      padding: 16px clamp(1rem, 3.5vw, 3rem) 100px;
      z-index: 2;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(clamp(250px, 20vw, 360px), 1fr));
      gap: clamp(14px, 1.8vw, 24px);
      align-items: stretch;
      align-content: start;
      overflow-y: auto;
      min-height: 0;
      width: 100%;
      max-width: 2200px;
      margin: 0 auto;
      box-sizing: border-box;
    }

    /* Optimized Grid Profiles based on active Card Count */
    .main-content[data-count="1"] {
      grid-template-columns: minmax(320px, 580px);
      justify-content: center;
    }
    .main-content[data-count="2"] {
      grid-template-columns: repeat(2, minmax(280px, 1fr));
    }
    .main-content[data-count="3"] {
      grid-template-columns: repeat(3, minmax(260px, 1fr));
    }
    .main-content[data-count="4"] {
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr));
    }

    @media (max-width: 900px) {
      .main-content[data-count="3"],
      .main-content[data-count="2"] {
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      }
    }

    .card {
      border-radius: 14px;
      padding: 16px 18px 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35), inset 0 0 0 1px rgba(255, 255, 255, 0.4);
      background-color: white;
      color: #111;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 180px;
      box-sizing: border-box;
      container-type: size;
    }

    /* Container query: Switch to 2 columns if card height shrinks */
    @container (max-height: 280px) {
      .card-header-box {
        padding-bottom: 4px;
        margin-bottom: 5px;
      }
      .card-title {
        font-size: clamp(0.95rem, 2.2vh, 1.25rem);
      }
      .card-assigned ul:not(.cols-3) {
        display: grid !important;
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        gap: 4px !important;
      }
      .card-assigned li {
        padding: 3px 6px !important;
        font-size: clamp(0.72rem, 1.8vh, 0.85rem) !important;
      }
    }

    .card-header-box {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 2px solid rgba(0, 0, 0, 0.15);
      padding-bottom: 8px;
      margin-bottom: 10px;
    }

    .card-title {
      font-size: clamp(1.15rem, 1.4vw, 1.55rem);
      font-weight: 700;
      color: #111;
      margin: 0;
      line-height: 1.2;
      word-break: break-word;
    }

    .card-count-badge {
      font-size: 0.8rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 12px;
      background: rgba(0, 0, 0, 0.12);
      color: inherit;
      white-space: nowrap;
    }

    .card-desc {
      font-size: clamp(0.82rem, 0.9vw, 0.95rem);
      font-style: italic;
      margin-top: 12px;
      padding-top: 8px;
      border-top: 1px solid rgba(0, 0, 0, 0.15);
      text-align: center;
      line-height: 1.35;
      opacity: 0.85;
    }

    /* Dark theme contrast for grid presentation cards */
    .card.is-dark-theme {
      color: #ffffff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.2);
    }
    .card.is-dark-theme .card-header-box {
      border-bottom-color: rgba(255, 255, 255, 0.25);
    }
    .card.is-dark-theme .card-title {
      color: #ffffff;
    }
    .card.is-dark-theme .card-count-badge {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }
    .card.is-dark-theme .card-assigned li {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.15);
      border-bottom-color: rgba(255, 255, 255, 0.15);
    }
    .card.is-dark-theme .card-desc {
      color: rgba(255, 255, 255, 0.85);
      border-top-color: rgba(255, 255, 255, 0.25);
    }

    /* Light theme contrast */
    .card.is-light-theme {
      color: #111111;
    }
    .card.is-light-theme .card-header-box {
      border-bottom-color: rgba(0, 0, 0, 0.15);
    }
    .card.is-light-theme .card-title {
      color: #111111;
    }
    .card.is-light-theme .card-count-badge {
      background: rgba(0, 0, 0, 0.1);
      color: #111111;
    }
    .card.is-light-theme .card-assigned li {
      color: #111111;
      background: rgba(255, 255, 255, 0.45);
      border-bottom-color: rgba(0, 0, 0, 0.08);
    }
    .card.is-light-theme .card-desc {
      color: rgba(0, 0, 0, 0.7);
      border-top-color: rgba(0, 0, 0, 0.15);
    }

    .card-assigned {
      flex: 1;
      overflow-y: auto;
      min-height: 40px;
    }

    .card-assigned ul {
      list-style-type: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .card-assigned ul.cols-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }

    .card-assigned ul.cols-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }

    .card-empty-state {
      padding: 12px 8px;
      font-size: 0.88rem;
      font-style: italic;
      opacity: 0.65;
      text-align: center;
    }

    @keyframes rollingSheen {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .card-assigned li {
      position: relative;
      padding: 6px 10px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 6px;
      color: inherit;
      font-size: clamp(0.85rem, 1vw, 1.05rem);
      font-weight: 500;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.2);
    }

    .card-assigned li::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        110deg,
        transparent 20%,
        rgba(255, 255, 255, 0.6) 50%,
        transparent 80%
      );
      background-size: 200% 100%;
      background-repeat: no-repeat;
      pointer-events: none;
      animation: rollingSheen 3.2s infinite ease-in-out;
    }

    .card-assigned li:nth-child(1)::after { animation-delay: 0.1s; }
    .card-assigned li:nth-child(2)::after { animation-delay: 0.35s; }
    .card-assigned li:nth-child(3)::after { animation-delay: 0.6s; }
    .card-assigned li:nth-child(4)::after { animation-delay: 0.85s; }
    .card-assigned li:nth-child(5)::after { animation-delay: 1.1s; }
    .card-assigned li:nth-child(6)::after { animation-delay: 1.35s; }
    .card-assigned li:nth-child(7)::after { animation-delay: 1.6s; }
    .card-assigned li:nth-child(8)::after { animation-delay: 1.85s; }
    .card-assigned li:nth-child(9)::after { animation-delay: 2.1s; }
    .card-assigned li:nth-child(10)::after { animation-delay: 2.35s; }

    .title-header-container {
      position: relative;
      text-align: center;
      padding: 16px 1rem 0;
    }
    .main-title {
      margin: 0;
      z-index: 2;
      position: relative;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      color: var(--fg);
      text-shadow: 2px 2px 8px rgba(0,0,0,0.6);
      line-height: 1.15;
    }
    .stats-subtitle {
      margin: 4px 0 10px 0;
      z-index: 2;
      position: relative;
      font-size: 0.95rem;
      color: var(--muted);
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .top-tools-bar {
      position: absolute;
      top: 1rem;
      right: 1.5rem;
      display: flex;
      gap: 8px;
      align-items: flex-start;
      z-index: 25;
    }
    .banner {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: rgba(20, 18, 16, 0.94);
      color: #f3eee6;
      padding: 10px 24px;
      text-align: center;
      font-size: clamp(0.95rem, 1.6vw, 1.4rem);
      font-weight: 600;
      z-index: 30;
      box-sizing: border-box;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.4);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 2.2rem;
    }
    .banner-inner {
      display: inline-block;
      white-space: nowrap;
      text-align: center;
      max-width: 100%;
    }
    .banner-inner.is-marquee {
      position: absolute;
      white-space: nowrap;
      max-width: none;
      padding-left: 100%;
      animation: bannerTicker 18s linear infinite;
      will-change: transform;
    }
    @keyframes bannerTicker {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-100%, 0, 0); }
    }
    .banner:empty {
      display: none;
    }
    .permanent-qr-card {
      background: rgba(20, 18, 16, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 5px 6px;
      text-align: center;
      backdrop-filter: blur(4px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.35);
      display: block;
    }
    #permanent-qr {
      background: #ffffff;
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
      margin: 0 auto;
    }
    #permanent-qr canvas {
      display: none !important;
    }
    #permanent-qr img {
      display: block !important;
      width: 68px !important;
      height: 68px !important;
      margin: 0 auto !important;
    }
    .qr-label {
      display: block;
      font-size: 0.62rem;
      font-weight: 600;
      color: var(--muted, #9a9284);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-top: 3px;
      line-height: 1.1;
      white-space: nowrap;
    }
    .bg-watermark-logo {
      position: fixed;
      bottom: 4rem;
      right: 2rem;
      width: min(320px, 32vw);
      height: min(320px, 32vw);
      opacity: 0.045;
      pointer-events: none;
      z-index: 1;
      user-select: none;
    }

    /* Kiosk & Low-Height Responsive Profiles (e.g. 582px Laptop / Wall Kiosks) */
    @media (max-height: 720px) {
      .title-header-container {
        padding: 6px 1rem 0;
      }
      .main-title {
        font-size: clamp(1.25rem, 3.8vh, 1.85rem);
      }
      .stats-subtitle {
        margin: 2px 0 4px 0;
        font-size: 0.76rem;
      }
      .top-tools-bar {
        top: 0.35rem;
        right: 0.85rem;
        gap: 6px;
      }
      .permanent-qr-card {
        padding: 3px 4px;
      }
      #permanent-qr img {
        width: 44px !important;
        height: 44px !important;
      }
      .qr-label {
        font-size: 0.55rem;
        margin-top: 1px;
      }
      #live-clock {
        font-size: 0.95rem;
        padding: 2px 8px;
      }
      .main-content {
        padding: 6px clamp(8px, 1.8vw, 20px) 55px;
        gap: 10px;
      }
      .card {
        padding: 8px 12px 8px;
        min-height: 0;
        border-radius: 10px;
      }
      .card-header-box {
        padding-bottom: 4px;
        margin-bottom: 6px;
      }
      .card-title {
        font-size: clamp(0.95rem, 2.2vh, 1.25rem);
      }
      .card-count-badge {
        font-size: 0.72rem;
        padding: 1px 5px;
      }
      .card-assigned ul {
        gap: 3px;
      }
      .card-assigned li {
        padding: 3px 7px;
        font-size: clamp(0.72rem, 1.8vh, 0.88rem);
        border-radius: 4px;
      }
      .card-desc {
        font-size: 0.74rem;
        margin-top: 5px;
        padding-top: 3px;
        line-height: 1.2;
      }
      .banner {
        padding: 6px 16px;
        font-size: clamp(0.95rem, 2.4vh, 1.25rem);
      }
    }

    @media (max-height: 560px) {
      .main-title {
        font-size: 1.15rem;
      }
      .stats-subtitle {
        display: none;
      }
      .top-tools-bar {
        top: 0.2rem;
        right: 0.5rem;
      }
      .main-content {
        padding: 4px 10px 45px;
        gap: 8px;
      }
      .card {
        padding: 6px 10px 6px;
      }
      .card-assigned li {
        padding: 2px 5px;
        font-size: 0.72rem;
      }
    }
  </style>
</head>

<body>

  <!-- Ambient Background Watermark Logo -->
  <div class="bg-watermark-logo" aria-hidden="true">
    <svg viewBox="4 8 40 30" width="100%" height="100%" preserveAspectRatio="xMaxYMax meet">
      <rect x="7" y="13" width="16" height="23" rx="3.5" transform="rotate(-14 15 24.5)" fill="#38bdf8"/>
      <rect x="25" y="13" width="16" height="23" rx="3.5" transform="rotate(14 33 24.5)" fill="#c084fc"/>
      <rect x="14" y="9" width="20" height="27" rx="4.5" fill="#fbbf24"/>
      <rect x="18.5" y="14.5" width="11" height="2.2" rx="1.1" fill="#ffffff" opacity="0.95"/>
      <rect x="18.5" y="19" width="8" height="2.2" rx="1.1" fill="#ffffff" opacity="0.75"/>
      <circle cx="19.5" cy="26" r="1.6" fill="#ffffff"/>
      <circle cx="25" cy="26" r="1.6" fill="#ffffff"/>
    </svg>
  </div>

  <div class="title-header-container">
    <h1 id="main-title" class="main-title"></h1>
    <p id="stats-subtitle" class="stats-subtitle"></p>
    <div class="top-tools-bar">
      <div id="permanent-qr-card" class="permanent-qr-card">
        <div id="permanent-qr"></div>
        <span class="qr-label">Mobile Roster</span>
      </div>
      <div id="live-clock" style="font-family: Fraunces, 'Times New Roman', serif; font-variant-numeric: tabular-nums; font-size: 1.15rem; font-weight: 500; color: var(--muted); letter-spacing: 0.05em; background: rgba(20, 18, 16, 0.75); padding: 4px 12px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(4px);">00:00:00</div>
      <button id="fullscreen-btn" onclick="toggleFullscreen()" title="Toggle Fullscreen (F)" style="background: rgba(20, 18, 16, 0.75); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 6px; padding: 7px 9px; color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
        </svg>
      </button>
    </div>
  </div>

  <div class="main-content" id="cards-container" role="listbox" aria-label="Assigned to Departments">
    <!-- Cards populated here -->
  </div>

  <div class="banner" id="banner"></div>

  <script src="qrcode.min.js"></script>
  <script>
    let isFirstLoad = true;
    let latestData = null;
    let lastQrPayload = null;

    function packSummaryPayload(d) {
      const t = encodeURIComponent(d.title || "Staff Assignment");
      const gList = (d.groups || []).map(g => {
        const gTitle = encodeURIComponent(g.title || "Untitled");
        const names = (g.assigned || []).map(n => encodeURIComponent(n)).join(",");
        return `${gTitle}:${names}`;
      });
      return `T=${t}&G=${gList.join("|")}`;
    }

    function getSummaryUrl() {
      if (!latestData) return window.location.href;
      const payload = packSummaryPayload(latestData);
      let href = window.location.href.split('#')[0];
      let basePath = href.substring(0, href.lastIndexOf('/') + 1);
      return `${basePath}summary.htm#${payload}`;
    }

    function updatePermanentQr() {
      const qrCard = document.getElementById("permanent-qr-card");
      const qrContainer = document.getElementById("permanent-qr");
      if (!qrCard || !qrContainer || !latestData) return;
      
      if (!latestData.showQr) {
        qrCard.style.display = "none";
        return;
      }
      qrCard.style.display = "block";
      
      const payload = packSummaryPayload(latestData);
      if (payload === lastQrPayload && qrContainer.innerHTML !== "") return;
      lastQrPayload = payload;
      
      const shareUrl = getSummaryUrl();
      qrContainer.innerHTML = "";
      if (typeof QRCode !== "undefined") {
        new QRCode(qrContainer, {
          text: shareUrl,
          width: 62,
          height: 62,
          colorDark: "#181614",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.L
        });
      }
    }

    function unpackData(packed) {
      try {
        const decoded = decodeURIComponent(atob(packed));
        const json = JSON.parse(decoded);
        if (json && json.g && Array.isArray(json.g)) {
          return {
            title: json.t || "Staff Assignment",
            banner: json.b || "",
            groups: json.g.map((item, idx) => ({
              id: Date.now() + idx,
              title: item[0] || `Group ${idx + 1}`,
              assigned: Array.isArray(item[1]) ? item[1] : [],
              description: item[2] || "",
              color: item[3] || "#ffffff"
            }))
          };
        }
        if (json && Array.isArray(json.groups)) {
          return json;
        }
      } catch(err) {
        console.error("Failed to unpack data:", err);
      }
      return null;
    }

    // Check if URL hash has #data= payload
    if (window.location.hash.startsWith("#data=")) {
      const rawHash = window.location.hash.substring(6);
      const parsed = unpackData(rawHash);
      if (parsed && Array.isArray(parsed.groups)) {
        localStorage.setItem("assignerData", JSON.stringify(parsed));
      }
    }

    function updateClock() {
      const clockEl = document.getElementById("live-clock");
      if (!clockEl) return;
      const now = new Date();
      clockEl.textContent = now.toLocaleTimeString([], { hour12: false });
    }
    setInterval(updateClock, 1000);
    updateClock();

    function getContrastTheme(colorStr) {
      if (!colorStr) return 'is-light-theme';
      let r = 255, g = 255, b = 255;
      if (colorStr.startsWith('#')) {
        let hex = colorStr.slice(1);
        if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
        if (hex.length === 6) {
          r = parseInt(hex.substring(0, 2), 16);
          g = parseInt(hex.substring(2, 4), 16);
          b = parseInt(hex.substring(4, 6), 16);
        }
      } else if (colorStr.startsWith('hsl')) {
        const match = colorStr.match(/hsl\(\s*([\d.]+)\s*,\s*([\d.]+)%\s*,\s*([\d.]+)%\s*\)/);
        if (match) {
          const h = parseFloat(match[1]);
          const s = parseFloat(match[2]) / 100;
          const l = parseFloat(match[3]) / 100;
          const c = (1 - Math.abs(2 * l - 1)) * s;
          const x = c * (1 - Math.abs((h / 60) % 2 - 1));
          const m = l - c / 2;
          let rP = 0, gP = 0, bP = 0;
          if (h < 60) { rP = c; gP = x; }
          else if (h < 120) { rP = x; gP = c; }
          else if (h < 180) { gP = c; bP = x; }
          else if (h < 240) { gP = x; bP = c; }
          else if (h < 300) { rP = x; bP = c; }
          else { rP = c; bP = x; }
          r = Math.round((rP + m) * 255);
          g = Math.round((gP + m) * 255);
          b = Math.round((bP + m) * 255);
        }
      } else if (colorStr.startsWith('rgb')) {
        const match = colorStr.match(/rgb\(\s*([\d.]+)\s*,\s*([\d.]+)\s*,\s*([\d.]+)\s*\)/);
        if (match) {
          r = parseFloat(match[1]);
          g = parseFloat(match[2]);
          b = parseFloat(match[3]);
        }
      }
      const yiq = (r * 299 + g * 587 + b * 114) / 1000;
      return yiq < 145 ? 'is-dark-theme' : 'is-light-theme';
    }

    function render() {
      const saved = localStorage.getItem("assignerData");
      if (!saved) return;

      const data = JSON.parse(saved);
      latestData = data;
      updatePermanentQr();
      const container = document.getElementById("cards-container");
      const banner = document.getElementById("banner");
      const mainTitle = document.getElementById("main-title");
      const statsSubtitle = document.getElementById("stats-subtitle");

      if (banner) {
        const text = data.banner || "";
        const currentText = banner.dataset.rawText || "";
        if (text !== currentText) {
          banner.dataset.rawText = text;
          banner.innerHTML = `<span class="banner-inner">${text}</span>`;
          checkGridBannerOverflow();
        }
      }

      const displayTitle = data.title || "Staff Assignment";
      if (mainTitle.innerText !== displayTitle) {
        mainTitle.innerText = displayTitle;
      }

      const groups = data.groups || [];
      container.dataset.count = groups.length;

      const totalPeople = groups.reduce((acc, g) => acc + ((g.assigned && Array.isArray(g.assigned)) ? g.assigned.length : 0), 0);
      const totalCards = groups.length;
      const peopleLabel = totalPeople === 1 ? "Person" : "People";
      const cardsLabel = totalCards === 1 ? "Group" : "Groups";
      if (statsSubtitle) {
        statsSubtitle.innerText = `${totalPeople} ${peopleLabel} Assigned · ${totalCards} ${cardsLabel}`;
      }

      if (!data.groups || data.groups.length === 0) {
        container.innerHTML = "<h2>No groups available. Please add some in the editor.</h2>";
        return;
      }

      if (container.querySelector("h2")) {
        container.innerHTML = "";
      }

      const currentGroups = new Set(data.groups.map(g => g.id.toString()));

      Array.from(container.querySelectorAll(".card")).forEach(card => {
        if (!currentGroups.has(card.dataset.groupId)) {
          card.remove();
        }
      });

      data.groups.forEach(g => {
        let card = container.querySelector(`.card[data-group-id="${g.id}"]`);
        if (!card) {
          card = document.createElement("div");
          card.className = "card";
          card.dataset.groupId = g.id;
          card.innerHTML = `
            <div class="card-header-box">
              <h2 class="card-title"></h2>
              <span class="card-count-badge">0</span>
            </div>
            <div class="card-assigned"><ul></ul></div>
          `;
          container.appendChild(card);
        }

        const themeClass = getContrastTheme(g.color);
        card.className = `card ${themeClass}`;
        card.style.backgroundColor = g.color;

        const titleEl = card.querySelector(".card-title");
        const titleText = g.title || 'Untitled';
        if (titleEl.innerText !== titleText) titleEl.innerText = titleText;

        const assignedList = Array.isArray(g.assigned) ? g.assigned : [];
        const countBadge = card.querySelector(".card-count-badge");
        if (countBadge) countBadge.innerText = assignedList.length;

        const ul = card.querySelector("ul");
        const isShortScreen = window.innerHeight <= 720;
        let colClass = "";
        if (assignedList.length >= 14 || (isShortScreen && assignedList.length >= 10)) {
          colClass = "cols-3";
        } else if (assignedList.length >= 7 || (isShortScreen && assignedList.length >= 5)) {
          colClass = "cols-2";
        }
        ul.className = colClass;

        if (assignedList.length === 0) {
          ul.innerHTML = `<li class="card-empty-state" style="background: transparent; border: none; font-style: italic; opacity: 0.6; text-align: center; padding: 12px 4px; pointer-events: none;">No staff assigned</li>`;
        } else {
          const sortedAssigned = [...assignedList].sort((a, b) => a.localeCompare(b));

          let existingLis = Array.from(ul.querySelectorAll("li:not(.card-empty-state)"));
          let existingNames = existingLis.map(li => li.innerText);

          let isDifferent = sortedAssigned.length !== existingNames.length || sortedAssigned.some((name, i) => name !== existingNames[i]);

          if (isDifferent) {
            let newNodes = [];

            sortedAssigned.forEach(name => {
              let li = existingLis.find(el => el.innerText === name);
              if (!li) {
                li = document.createElement("li");
                li.innerText = name;
              }
              newNodes.push(li);
            });

            ul.innerHTML = "";
            newNodes.forEach(li => ul.appendChild(li));
          }
        }

        let descEl = card.querySelector(".card-desc");
        if (g.description) {
          if (!descEl) {
            descEl = document.createElement("div");
            descEl.className = "card-desc";
            card.appendChild(descEl);
          }
          if (descEl.innerText !== g.description) descEl.innerText = g.description;
        } else if (descEl) {
          descEl.remove();
        }
      });

      adaptGridColumns();
      isFirstLoad = false;
    }

    function adaptGridColumns() {
      document.querySelectorAll(".card-assigned").forEach(box => {
        const ul = box.querySelector("ul");
        if (!ul) return;
        const items = ul.querySelectorAll("li:not(.card-empty-state)");
        if (!ul.classList.contains("cols-2") && !ul.classList.contains("cols-3") && items.length >= 4) {
          if (box.scrollHeight > box.clientHeight + 2) {
            ul.classList.add("cols-2");
          }
        }
      });
    }
    window.addEventListener("resize", adaptGridColumns);

    function checkGridBannerOverflow() {
      const banner = document.getElementById("banner");
      if (!banner) return;
      const inner = banner.querySelector(".banner-inner");
      if (!inner) return;
      inner.classList.remove("is-marquee");
      inner.style.animationDuration = "";
      if (inner.scrollWidth > banner.clientWidth + 4) {
        inner.classList.add("is-marquee");
        const distance = inner.scrollWidth + banner.clientWidth;
        const duration = Math.max(10, Math.round(distance / 65));
        inner.style.animationDuration = `${duration}s`;
      }
    }
    window.addEventListener("resize", checkGridBannerOverflow);

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.warn("Fullscreen request:", err));
      } else if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }

    window.toggleFullscreen = toggleFullscreen;
    const fsBtn = document.getElementById("fullscreen-btn");
    if (fsBtn) fsBtn.onclick = toggleFullscreen;

    window.addEventListener("keydown", (e) => {
      if (e.key === "f" || e.key === "F") {
        e.preventDefault();
        toggleFullscreen();
      }
    });

    document.addEventListener("dblclick", (e) => {
      if (e.target.closest("button, input, textarea, a")) return;
      toggleFullscreen();
    });

    setInterval(render, 1000);
    render();
  </script>

</body>
