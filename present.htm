<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Outfit:wght@400;500;600&display=swap" />
  <title>Assigner - Presentation</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='12' fill='%23181614'/%3E%3Crect x='8' y='14' width='16' height='22' rx='3.5' transform='rotate(-12 16 25)' fill='%2338bdf8' opacity='0.85'/%3E%3Crect x='24' y='14' width='16' height='22' rx='3.5' transform='rotate(12 32 25)' fill='%23a855f7' opacity='0.85'/%3E%3Crect x='15' y='11' width='18' height='24' rx='4' fill='%23f59e0b' stroke='%23181614' stroke-width='1.5'/%3E%3Crect x='19' y='16' width='10' height='2' rx='1' fill='%23ffffff' opacity='0.9'/%3E%3Crect x='19' y='21' width='7' height='2' rx='1' fill='%23ffffff' opacity='0.7'/%3E%3Ccircle cx='20' cy='27' r='1.5' fill='%23ffffff'/%3E%3Ccircle cx='25' cy='27' r='1.5' fill='%23ffffff'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #0b0a08;
      --surface: #141210;
      --fg: #f3eee6;
      --muted: #9a9284;
      --card-w: clamp(10.25rem, 42vw, 17.25rem);
      --card-h: calc(var(--card-w) * 1.5);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100vh;
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: Outfit, ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      cursor: pointer;
    }

    button:not(:disabled):active {
      scale: 0.96;
    }

    body {
      padding: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .main-content {
      flex: 1;
      padding: 10px 40px 100px;
      z-index: 2;
      display: flex;
      flex-wrap: wrap;
      gap: 24px;
      justify-content: center;
      align-items: flex-start;
      align-content: center;
      overflow-y: auto;
      min-height: 0;
    }

    .card {
      border-radius: 10px;
      padding: 15px;
      width: 250px;
      min-height: 150px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2), inset 0 0 0 1px rgba(255, 255, 255, 0.4);
      background-color: white;
      color: #111;
      display: flex;
      flex-direction: column;
    }

    .card-title {
      font-size: 1.2em;
      font-weight: bold;
      margin-bottom: 6px;
      border-bottom: 2px solid rgba(0, 0, 0, 0.15);
      padding-bottom: 5px;
      color: #111;
      text-align: center;
    }

    .card-desc {
      font-size: 0.9em;
      font-style: italic;
      color: #333;
      margin-bottom: 10px;
      text-align: center;
    }

    .card-assigned {
      flex: 1;
      overflow-y: auto;
    }

    .card-assigned ul {
      list-style-type: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    @keyframes rollingSheen {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .card-assigned li {
      position: relative;
      padding: 6px 8px;
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 4px;
      color: #111;
      font-weight: 500;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.2);
    }

    .card-assigned li::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        110deg,
        transparent 20%,
        rgba(255, 255, 255, 0.6) 50%,
        transparent 80%
      );
      background-size: 200% 100%;
      background-repeat: no-repeat;
      pointer-events: none;
      animation: rollingSheen 3.2s infinite ease-in-out;
    }

    .card-assigned li:nth-child(1)::after { animation-delay: 0.1s; }
    .card-assigned li:nth-child(2)::after { animation-delay: 0.35s; }
    .card-assigned li:nth-child(3)::after { animation-delay: 0.6s; }
    .card-assigned li:nth-child(4)::after { animation-delay: 0.85s; }
    .card-assigned li:nth-child(5)::after { animation-delay: 1.1s; }
    .card-assigned li:nth-child(6)::after { animation-delay: 1.35s; }
    .card-assigned li:nth-child(7)::after { animation-delay: 1.6s; }
    .card-assigned li:nth-child(8)::after { animation-delay: 1.85s; }
    .card-assigned li:nth-child(9)::after { animation-delay: 2.1s; }
    .card-assigned li:nth-child(10)::after { animation-delay: 2.35s; }

    .banner {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #333;
      color: white;
      padding: 15px;
      text-align: center;
      font-size: 1.5em;
      font-weight: bold;
      z-index: 3;
      box-sizing: border-box;
    }
    .permanent-qr-card {
      background: rgba(20, 18, 16, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 5px 6px;
      text-align: center;
      backdrop-filter: blur(4px);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.35);
      display: block;
    }
    #permanent-qr {
      background: #ffffff;
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
      margin: 0 auto;
    }
    #permanent-qr canvas {
      display: none !important;
    }
    #permanent-qr img {
      display: block !important;
      width: 68px !important;
      height: 68px !important;
      margin: 0 auto !important;
    }
    .qr-label {
      display: block;
      font-size: 0.62rem;
      font-weight: 600;
      color: var(--muted, #9a9284);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-top: 3px;
      line-height: 1.1;
      white-space: nowrap;
    }
  </style>
</head>

<body>

  <div style="position: relative; text-align: center;">
    <h1 id="main-title"
      style="margin: 24px 0 0 0; z-index: 2; position: relative; font-size: 2.6em; color: var(--fg); text-shadow: 2px 2px 8px rgba(0,0,0,0.6);">
    </h1>
    <p id="stats-subtitle"
      style="margin: 6px 0 16px 0; z-index: 2; position: relative; font-size: 1em; color: var(--muted); font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase;">
    </p>
    <div style="position: absolute; top: 1.25rem; right: 1.5rem; display: flex; gap: 8px; align-items: flex-start; z-index: 25;">
      <div id="permanent-qr-card" class="permanent-qr-card">
        <div id="permanent-qr"></div>
        <span class="qr-label">Mobile Roster</span>
      </div>
      <div id="live-clock" style="font-family: Fraunces, 'Times New Roman', serif; font-variant-numeric: tabular-nums; font-size: 1.15rem; font-weight: 500; color: var(--muted); letter-spacing: 0.05em; background: rgba(20, 18, 16, 0.75); padding: 4px 12px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(4px);">00:00:00</div>
      <button id="fullscreen-btn" onclick="toggleFullscreen()" title="Toggle Fullscreen (F)" style="background: rgba(20, 18, 16, 0.75); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 6px; padding: 7px 9px; color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="15" height="15">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
        </svg>
      </button>
    </div>
  </div>

  <div class="main-content" id="cards-container" role="listbox" aria-label="Assigned to Departments">
    <!-- Cards populated here -->
  </div>

  <div class="banner" id="banner"></div>

  <script src="qrcode.min.js"></script>
  <script>
    let isFirstLoad = true;
    let latestData = null;
    let lastQrPayload = null;

    function packSummaryPayload(d) {
      const t = encodeURIComponent(d.title || "Staff Assignment");
      const gList = (d.groups || []).map(g => {
        const gTitle = encodeURIComponent(g.title || "Untitled");
        const names = (g.assigned || []).map(n => encodeURIComponent(n)).join(",");
        return `${gTitle}:${names}`;
      });
      return `T=${t}&G=${gList.join("|")}`;
    }

    function getSummaryUrl() {
      if (!latestData) return window.location.href;
      const payload = packSummaryPayload(latestData);
      let href = window.location.href.split('#')[0];
      let basePath = href.substring(0, href.lastIndexOf('/') + 1);
      return `${basePath}summary.htm#${payload}`;
    }

    function updatePermanentQr() {
      const qrCard = document.getElementById("permanent-qr-card");
      const qrContainer = document.getElementById("permanent-qr");
      if (!qrCard || !qrContainer || !latestData) return;
      
      if (latestData.showQr === false) {
        qrCard.style.display = "none";
        return;
      }
      qrCard.style.display = "block";
      
      const payload = packSummaryPayload(latestData);
      if (payload === lastQrPayload && qrContainer.innerHTML !== "") return;
      lastQrPayload = payload;
      
      const shareUrl = getSummaryUrl();
      qrContainer.innerHTML = "";
      if (typeof QRCode !== "undefined") {
        new QRCode(qrContainer, {
          text: shareUrl,
          width: 62,
          height: 62,
          colorDark: "#181614",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.L
        });
      }
    }

    function unpackData(packed) {
      try {
        const decoded = decodeURIComponent(atob(packed));
        const json = JSON.parse(decoded);
        if (json && json.g && Array.isArray(json.g)) {
          return {
            title: json.t || "Staff Assignment",
            banner: json.b || "",
            groups: json.g.map((item, idx) => ({
              id: Date.now() + idx,
              title: item[0] || `Group ${idx + 1}`,
              assigned: Array.isArray(item[1]) ? item[1] : [],
              description: item[2] || "",
              color: item[3] || "#ffffff"
            }))
          };
        }
        if (json && Array.isArray(json.groups)) {
          return json;
        }
      } catch(err) {
        console.error("Failed to unpack data:", err);
      }
      return null;
    }

    // Check if URL hash has #data= payload
    if (window.location.hash.startsWith("#data=")) {
      const rawHash = window.location.hash.substring(6);
      const parsed = unpackData(rawHash);
      if (parsed && Array.isArray(parsed.groups)) {
        localStorage.setItem("assignerData", JSON.stringify(parsed));
      }
    }

    function updateClock() {
      const clockEl = document.getElementById("live-clock");
      if (!clockEl) return;
      const now = new Date();
      clockEl.textContent = now.toLocaleTimeString([], { hour12: false });
    }
    setInterval(updateClock, 1000);
    updateClock();

    function render() {
      const saved = localStorage.getItem("assignerData");
      if (!saved) return;

      const data = JSON.parse(saved);
      latestData = data;
      updatePermanentQr();
      const container = document.getElementById("cards-container");
      const banner = document.getElementById("banner");
      const mainTitle = document.getElementById("main-title");
      const statsSubtitle = document.getElementById("stats-subtitle");

      if (banner.innerText !== data.banner) {
        banner.innerText = data.banner;
      }

      const displayTitle = data.title || "Staff Assignment";
      if (mainTitle.innerText !== displayTitle) {
        mainTitle.innerText = displayTitle;
      }

      const groups = data.groups || [];
      const totalPeople = groups.reduce((acc, g) => acc + ((g.assigned && Array.isArray(g.assigned)) ? g.assigned.length : 0), 0);
      const totalCards = groups.length;
      const peopleLabel = totalPeople === 1 ? "Person" : "People";
      const cardsLabel = totalCards === 1 ? "Group" : "Groups";
      if (statsSubtitle) {
        statsSubtitle.innerText = `${totalPeople} ${peopleLabel} Assigned · ${totalCards} ${cardsLabel}`;
      }

      if (!data.groups || data.groups.length === 0) {
        container.innerHTML = "<h2>No groups available. Please add some in the editor.</h2>";
        allListItems = [];
        return;
      }

      if (container.querySelector("h2")) {
        container.innerHTML = "";
      }

      const currentGroups = new Set(data.groups.map(g => g.id.toString()));

      Array.from(container.querySelectorAll(".card")).forEach(card => {
        if (!currentGroups.has(card.dataset.groupId)) {
          card.remove();
        }
      });

      data.groups.forEach(g => {
        let card = container.querySelector(`.card[data-group-id="${g.id}"]`);
        if (!card) {
          card = document.createElement("div");
          card.className = "card";
          card.dataset.groupId = g.id;
          card.innerHTML = `
          <div class="card-title"></div>
          <div class="card-assigned"><ul></ul></div>
        `;
          container.appendChild(card);
        }

        card.style.backgroundColor = g.color;

        const titleEl = card.querySelector(".card-title");
        const titleText = g.title || 'Untitled';
        if (titleEl.innerText !== titleText) titleEl.innerText = titleText;

        let descEl = card.querySelector(".card-desc");
        if (g.description) {
          if (!descEl) {
            descEl = document.createElement("div");
            descEl.className = "card-desc";
            titleEl.after(descEl);
          }
          if (descEl.innerText !== g.description) descEl.innerText = g.description;
        } else if (descEl) {
          descEl.remove();
        }

        const ul = card.querySelector("ul");
        const sortedAssigned = [...g.assigned].sort((a, b) => a.localeCompare(b));

        let existingLis = Array.from(ul.querySelectorAll("li"));
        let existingNames = existingLis.map(li => li.innerText);

        let isDifferent = sortedAssigned.length !== existingNames.length || sortedAssigned.some((name, i) => name !== existingNames[i]);

        if (isDifferent) {
          let newNodes = [];

          sortedAssigned.forEach(name => {
            let li = existingLis.find(el => el.innerText === name);
            if (!li) {
              li = document.createElement("li");
              li.innerText = name;
            }
            newNodes.push(li);
          });

          ul.innerHTML = "";
          newNodes.forEach(li => ul.appendChild(li));
        }
      });

      isFirstLoad = false;
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.warn("Fullscreen request:", err));
      } else if (document.exitFullscreen) {
        document.exitFullscreen();
      }
    }

    window.toggleFullscreen = toggleFullscreen;
    const fsBtn = document.getElementById("fullscreen-btn");
    if (fsBtn) fsBtn.onclick = toggleFullscreen;

    window.addEventListener("keydown", (e) => {
      if (e.key === "f" || e.key === "F") {
        e.preventDefault();
        toggleFullscreen();
      }
    });

    document.addEventListener("dblclick", (e) => {
      if (e.target.closest("button, input, textarea, a")) return;
      toggleFullscreen();
    });

    setInterval(render, 1000);
    render();
  </script>

</body>

</html>
